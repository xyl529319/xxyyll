            .hero-badges{justify-content:flex-start}
            .badge{background:#f0f0f0;color:#333;border:1px solid #ccc}
            .section{padding:16px 0;page-break-inside:avoid}
            .card,.skill-category,.cert-card,.highlight-card{box-shadow:none;border:1px solid #ddd;background:#fff;page-break-inside:avoid}
            .highlight-num{color:#000}
            .tab-panel{display:block!important;animation:none}
            .tabs-nav{display:none}
            .card ul li{color:#333}
            .section-title::before{background:#000}
            .highlight-card:hover,.card:hover,.cert-card:hover{transform:none;box-shadow:none}
            .footer{border-top:1px solid #ccc;color:#666}
            a{color:#000}

            .hero .subtitle{font-size:.9rem}
            .nav-links a{padding:5px 7px;font-size:.75rem}
            .nav-brand{font-size:.9rem}
            .btn{padding:8px 16px;font-size:.82rem}
            .card{padding:14px 16px}
            .card-title{font-size:.9rem}
            .highlight-num{font-size:1.5rem}
            .back-top{bottom:16px;right:16px;width:36px;height:36px;font-size:1rem}
        }
    </style>
</head>

                    { category: 'AI与数据标注', tags: [{ name: '数据标注规范', high: true }, { name: '质量检验', high: true }, { name: 'OCR标注', high: true }, { name: '图像分类标注', high: false }, { name: '人机协同训练', high: false }] },
                    { category: '编程与工具', tags: [{ name: 'Python', high: true }, { name: 'Pandas', high: true }, { name: 'NumPy', high: true }, { name: 'Matplotlib', high: true }, { name: 'SQL入门', high: false }, { name: 'Markdown', high: false }, { name: 'LaTeX', high: false }, { name: 'ChatGPT/AI工具', high: true }] },
                    { category: '数据分析', tags: [{ name: '数据清洗', high: true }, { name: '描述统计', high: true }, { name: '可视化', high: true }, { name: '相关性分析', high: false }, { name: '机器学习入门', high: false }] },
                    { category: '设计与文档', tags: [{ name: 'Canva', high: true }, { name: 'PPT汇报', high: true }, { name: '结构化图表', high: true }] },
                    { category: '特长', tags: [{ name: '二胡十级', high: true }, { name: '软笔书法十级', high: true }, { name: '素描十级', high: true }] },
                    { category: '语言', tags: [{ name: '普通话流利', high: true }, { name: '英语CET-4', high: false }, { name: '技术文档阅读', high: false }] },
                ],
                education: [
                    { school: '上海海事大学', degree: '数学类 · 理学学士', date: '2026.09 – 2030.06（预计）', details: '主修：数学分析、高等代数、概率论与数理统计、数学模型、程序设计基础（Python/C++）。参与数学建模入门培训，自学机器学习与数据分析。' },
                    { school: '浙江省武义第一中学', degree: '高中毕业', date: '2023.09 – 2026.06', details: '理科综合成绩优秀，数学与物理单科多次年级前5%，逻辑思维与抽象分析能力突出，关注AI与数据科学方向。' },
                ],
                certificates: [
                    { name: '阿里巴巴认证初级AI训练师', issuer: '阿里巴巴集团', year: '2025' },
                    { name: '二胡十级证书', issuer: '中国音乐学院考级委员会', year: '' },
                    { name: '软笔书法十级证书', issuer: '中国美术学院社会美术水平考级中心', year: '' },
                    { name: '素描十级证书', issuer: '中国艺术科技研究所', year: '' },
                ],
            };

            const app = document.getElementById('app');
            const backTop = document.getElementById('backTop');
            const toast = document.getElementById('toast');

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._tid);
                toast._tid = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function copyEmail() {
                const email = resume.email;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(email).then(() => showToast('✅ 邮箱已复制: ' + email));
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = email;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy');
                        showToast('✅ 邮箱已复制: ' + email); } catch (e) { showToast('⚠️ 复制失败，请手动记录'); }
                    document.body.removeChild(ta);
                }
            }

            function render() {
                let html = '';
                // Hero —— 使用真实头像照片 logo.jpg，加载失败则显示"徐"字备用
                html += `
        <section class="hero" id="about">
        <div class="hero-content">
        <div class="hero-avatar-wrapper">
        <img src="${resume.avatarSrc}" alt="徐钰林头像" class="hero-avatar-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="hero-avatar-fallback" style="display:none;" aria-hidden="true">徐</div>
        </div>
        <h1>${resume.name}</h1>
        <p class="subtitle">${resume.heroTitle}</p>
        <p style="max-width:600px;margin:0 auto 12px;color:var(--text2);font-size:.9rem;line-height:1.6;">${resume.heroIntro}</p>
        <div class="hero-badges">
        ${resume.heroBadges.map(b=>`<span class="badge${b.accent?' accent':''}">${b.text}</span>`).join('')}
        </div>
        <div class="hero-cta">
        <span class="email-display">
        📧 ${resume.email}
        <button class="copy-btn" onclick="window._copyEmail()" title="复制邮箱" aria-label="复制邮箱">📋</button>
        </span>
        <a class="btn btn-outline" href="tel:${resume.phone}">📞 ${resume.phone}</a>
        </div>
        </div>
        </section>`;

                // Highlights
                html += `
        <section class="section" id="highlights">
        <h2 class="section-title">亮点成果</h2>
        <div class="highlights-grid">
        ${resume.highlights.map(h=>`<div class="highlight-card"><div class="highlight-num">${h.num}</div><div class="highlight-label">${h.label}</div></div>`).join('')}
        </div>
        </section>`;

                // Experiences
                const expTabs = [...new Set(resume.experiences.map(e => e.tab))];
                html += `
        <section class="section" id="experience">
        <h2 class="section-title">实习/实践经历</h2>
        <div class="tabs-nav" role="tablist" aria-label="经历分类" id="expTabsNav">
        ${expTabs.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-tab="exp-${i}" id="expTab-${i}">${t}</button>`).join('')}
        </div>
        ${expTabs.map((tab,ti)=>{
            const items=resume.experiences.filter(e=>e.tab===tab);
            return `<div class="tab-panel${ti===0?' active':''}" role="tabpanel" aria-labelledby="expTab-${ti}" id="expPanel-${ti}">
            ${items.map(e=>`
            <div class="card">
            <div class="card-header">
            <div><div class="card-title">${e.title}</div><div class="card-subtitle">${e.subtitle}</div></div>
            <span class="card-meta">${e.date}</span>
            </div>
            <ul>${e.points.map(p=>`<li>${p}</li>`).join('')}</ul>
            </div>`).join('')}
            </div>`;
        }).join('')}
        </section>`;

                // Projects
                const projTabs = [...new Set(resume.projects.map(p => p.tab))];
                html += `
        <section class="section" id="projects">
        <h2 class="section-title">项目经历</h2>
        <div class="tabs-nav" role="tablist" aria-label="项目分类" id="projTabsNav">
        ${projTabs.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-tab="proj-${i}" id="projTab-${i}">${t}</button>`).join('')}
        </div>
        ${projTabs.map((tab,ti)=>{
            const items=resume.projects.filter(p=>p.tab===tab);
            return `<div class="tab-panel${ti===0?' active':''}" role="tabpanel" aria-labelledby="projTab-${ti}" id="projPanel-${ti}">
            ${items.map(p=>`
            <div class="card">
            <div class="card-header">
            <div><div class="card-title">${p.title}</div><div class="card-subtitle">${p.subtitle} · ${p.date}</div></div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">${p.techStack.map(t=>`<span class="skill-tag high">${t}</span>`).join('')}</div>
            <ul>${p.points.map(pt=>`<li>${pt}</li>`).join('')}</ul>
            </div>`).join('')}
            </div>`;
        }).join('')}
        </section>`;

                // Skills
                html += `
        <section class="section" id="skills">
        <h2 class="section-title">技能矩阵</h2>
        <div class="skills-grid">
        ${resume.skills.map(s=>`
        <div class="skill-category">
        <h4>${s.category}</h4>
        <div class="skill-tags">${s.tags.map(t=>`<span class="skill-tag${t.high?' high':''}">${t.name}</span>`).join('')}</div>
        </div>`).join('')}
        </div>
        </section>`;

                // Education & Certificates
                html += `
        <section class="section" id="education">
        <h2 class="section-title">教育背景</h2>
        <div class="timeline">
        ${resume.education.map(ed=>`
        <div class="timeline-item">
        <div class="timeline-title">${ed.school}</div>
        <div class="timeline-sub">${ed.degree} · ${ed.date}</div>
        <p style="font-size:.85rem;color:var(--text2);margin-top:4px;">${ed.details}</p>
        </div>`).join('')}
        </div>
        </section>
        <section class="section" id="certificates">
        <h2 class="section-title">获奖与证书</h2>
        <div class="certs-grid">
        ${resume.certificates.map(c=>`
        <div class="cert-card">
        <div class="cert-icon">🏅</div>
        <div class="cert-info"><strong>${c.name}</strong><span>${c.issuer}${c.year?' · '+c.year:''}</span></div>
        </div>`).join('')}
        </div>
        </section>`;

                html += `
        <footer class="footer">
        <p>© 2026 徐钰林 · 持续更新中，更多项目与学习成果将在大学期间进一步沉淀。</p>
        <p style="margin-top:4px;font-size:.75rem;">最后更新：2026年7月</p>
        </footer>`;

                app.innerHTML = html;
                window._copyEmail = copyEmail;
                bindTabs('expTabsNav', 'expTab-', 'expPanel-');
                bindTabs('projTabsNav', 'projTab-', 'projPanel-');
            }

            function bindTabs(navId, tabPrefix, panelPrefix) {
                const nav = document.getElementById(navId);
                if (!nav) return;
                const buttons = nav.querySelectorAll('[role="tab"]');
                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.getAttribute('data-tab').split('-')[1];
                        const panelId = panelPrefix + idx;
                        nav.querySelectorAll('[role="tab"]').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
                        document.querySelectorAll('[id^="' + panelPrefix + '"]').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        this.setAttribute('aria-selected', 'true');
                        const panel = document.getElementById(panelId);
                        if (panel) panel.classList.add('active');
                    });
                    btn.addEventListener('keydown', function(e) {
                        const allBtns = Array.from(nav.querySelectorAll('[role="tab"]'));
                        const index = allBtns.indexOf(this);
                        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                            e.preventDefault();
                            const next = e.key === 'ArrowRight' ? (index + 1) % allBtns.length : (index - 1 + allBtns.length) % allBtns.length;
                            allBtns[next].focus();
                            allBtns[next].click();
                        }
                    });
                });
            }

            function initTheme() {
                const stored = localStorage.getItem('resume-theme');
                if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
                document.getElementById('themeToggle').addEventListener('click', () => {
                    const isDark = document.documentElement.classList.toggle('dark');
                    localStorage.setItem('resume-theme', isDark ? 'dark' : 'light');
                });
                document.getElementById('printBtn').addEventListener('click', () => window.print());
            }

            function initBackTop() {
                const toggle = () => {
                    if (window.scrollY > 400) backTop.classList.add('visible');
                    else backTop.classList.remove('visible');
                };
                window.addEventListener('scroll', toggle, { passive: true });
                backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                toggle();
            }

            function initNavScroll() {
                document.querySelectorAll('.nav-links a[href^="#"]').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) {
                            const navH = document.querySelector('.nav').offsetHeight;
                            const top = target.getBoundingClientRect().top + window.pageYOffset - navH - 8;
                            window.scrollTo({ top, behavior: 'smooth' });
                        }
                    });
                });
            }

            render();
            initTheme();
            initBackTop();
            initNavScroll();
        })();
    </script>
</body>
</html>
